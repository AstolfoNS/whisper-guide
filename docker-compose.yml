name: whisper-guide

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: whisper-guide-backend:${WHISPER_GUIDE_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
      args:
        APP_VERSION: ${WHISPER_GUIDE_VERSION:-dev}
        VCS_REF: ${WHISPER_GUIDE_REVISION:-unknown}
    environment:
      WHISPER_GUIDE_ENVIRONMENT: ${WHISPER_GUIDE_ENVIRONMENT:-production}
      WHISPER_GUIDE_APP_TITLE: ${WHISPER_GUIDE_APP_TITLE:-whisper-guide}
      WHISPER_GUIDE_CORS_ORIGINS: '${WHISPER_GUIDE_CORS_ORIGINS:-["http://localhost:8080"]}'
      WHISPER_GUIDE_DATA_DIR: ${WHISPER_GUIDE_DATA_DIR:-/data}
      WHISPER_GUIDE_BACKUP_DIR: ${WHISPER_GUIDE_BACKUP_DIR:-/backups}
      WHISPER_GUIDE_DEFAULT_SILENCE_TIMEOUT_MS: ${WHISPER_GUIDE_DEFAULT_SILENCE_TIMEOUT_MS:-3000}
      WHISPER_GUIDE_SCRIPT_MAX_FILE_BYTES: ${WHISPER_GUIDE_SCRIPT_MAX_FILE_BYTES:-2097152}
      WHISPER_GUIDE_SCRIPT_MAX_UPLOAD_FILES: ${WHISPER_GUIDE_SCRIPT_MAX_UPLOAD_FILES:-10}
      WHISPER_GUIDE_SPEECH_MODEL_DIR: ${WHISPER_GUIDE_SPEECH_MODEL_DIR:-/models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20}
      WHISPER_GUIDE_SPEECH_SAMPLE_RATE: ${WHISPER_GUIDE_SPEECH_SAMPLE_RATE:-16000}
      WHISPER_GUIDE_TTS_VOICE: ${WHISPER_GUIDE_TTS_VOICE:-zh-CN-XiaoxiaoNeural}
      WHISPER_GUIDE_STT_PROVIDER: ${WHISPER_GUIDE_STT_PROVIDER:-local}
      WHISPER_GUIDE_CLOUD_ENDPOINT: ${WHISPER_GUIDE_CLOUD_ENDPOINT:-}
      WHISPER_GUIDE_CLOUD_APP_ID: ${WHISPER_GUIDE_CLOUD_APP_ID:-}
      WHISPER_GUIDE_CLOUD_ACCESS_TOKEN: ${WHISPER_GUIDE_CLOUD_ACCESS_TOKEN:-}
      WHISPER_GUIDE_CLOUD_OPT_IN: ${WHISPER_GUIDE_CLOUD_OPT_IN:-false}
      WHISPER_GUIDE_STT_PROVIDER_CONFIGS: ${WHISPER_GUIDE_STT_PROVIDER_CONFIGS:-[]}
      WHISPER_GUIDE_CLOUD_STT_PROTOCOL: ${WHISPER_GUIDE_CLOUD_STT_PROTOCOL:-http-json}
      WHISPER_GUIDE_CLOUD_STT_AUTH_MODE: ${WHISPER_GUIDE_CLOUD_STT_AUTH_MODE:-api-key}
      WHISPER_GUIDE_CLOUD_STT_RESOURCE_ID: ${WHISPER_GUIDE_CLOUD_STT_RESOURCE_ID:-volc.seedasr.sauc.duration}
      WHISPER_GUIDE_CLOUD_STT_TIMEOUT_MS: ${WHISPER_GUIDE_CLOUD_STT_TIMEOUT_MS:-5000}
      WHISPER_GUIDE_CLOUD_STT_ENABLE_NONSTREAM: ${WHISPER_GUIDE_CLOUD_STT_ENABLE_NONSTREAM:-true}
      WHISPER_GUIDE_CLOUD_STT_ENDPOINT: ${WHISPER_GUIDE_CLOUD_STT_ENDPOINT:-}
      WHISPER_GUIDE_CLOUD_STT_APP_ID: ${WHISPER_GUIDE_CLOUD_STT_APP_ID:-}
      WHISPER_GUIDE_CLOUD_STT_ACCESS_TOKEN: ${WHISPER_GUIDE_CLOUD_STT_ACCESS_TOKEN:-}
      WHISPER_GUIDE_LLM_ALIGN_MODE: ${WHISPER_GUIDE_LLM_ALIGN_MODE:-off}
      WHISPER_GUIDE_LLM_PROVIDER_PRESET: ${WHISPER_GUIDE_LLM_PROVIDER_PRESET:-custom}
      WHISPER_GUIDE_LLM_BASE_URL: ${WHISPER_GUIDE_LLM_BASE_URL:-}
      WHISPER_GUIDE_LLM_MODEL: ${WHISPER_GUIDE_LLM_MODEL:-}
      WHISPER_GUIDE_LLM_API_KEY: ${WHISPER_GUIDE_LLM_API_KEY:-}
      WHISPER_GUIDE_LLM_TIMEOUT_MS: ${WHISPER_GUIDE_LLM_TIMEOUT_MS:-1500}
    volumes:
      - ./data/sqlite:/data
      - ./data/backups:/backups
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - /app/backend-core/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging

  frontend:
    image: whisper-guide-frontend:${WHISPER_GUIDE_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        APP_VERSION: ${WHISPER_GUIDE_VERSION:-dev}
        VCS_REF: ${WHISPER_GUIDE_REVISION:-unknown}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WHISPER_GUIDE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
