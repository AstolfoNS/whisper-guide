name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/backend-core
      - run: uv run ruff check .
        working-directory: apps/backend-core
      - run: uv run ruff format --check .
        working-directory: apps/backend-core
      - run: uv run ruff check --config pyproject.toml ../../scripts/release.py ../../deploy/verify_release.py
        working-directory: apps/backend-core
      - run: uv run ruff format --check --config pyproject.toml ../../scripts/release.py ../../deploy/verify_release.py
        working-directory: apps/backend-core
      - run: bash -n deploy/package.sh deploy/deploy.sh
      - name: Report Docker Compose version
        run: docker compose version
      - run: uv run pytest
        working-directory: apps/backend-core
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/frontend
      - run: pnpm test
        working-directory: apps/frontend
      - run: pnpm build
        working-directory: apps/frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: apps/backend-core
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/frontend
      - run: pnpm test:e2e
        working-directory: apps/frontend
