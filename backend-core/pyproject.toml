[project]
name = "backend-core"
version = "0.1.0"
description = "Server-side speech tracking and prompting API for Whisper Guide"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2,<8.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "numpy>=2.0,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pypinyin>=0.53,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "sherpa-onnx>=1.12,<2.0",
    "sherpa-onnx-core==1.13.8",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "webrtcvad-wheels>=2.0.14,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
